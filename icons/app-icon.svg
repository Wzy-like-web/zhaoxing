<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A0341A"/>
      <stop offset="100%" stop-color="#7A2614"/>
    </linearGradient>
  </defs>

  <!-- 红底 -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bgD)"/>

  <!-- 蒸汽（更优雅的曲线） -->
  <g fill="none" stroke="#F5D58C" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <path d="M 200 110 Q 188 145 200 180 Q 212 215 200 245" />
    <path d="M 256 90 Q 244 130 256 175 Q 268 220 256 260" />
    <path d="M 312 110 Q 324 145 312 180 Q 300 215 312 245" />
  </g>

  <!-- 兆字（在蒸汽上方更高的位置） -->
  <!-- 实际上把兆字放在最显眼位置：碗下方 -->

  <!-- 简洁的碗（一笔画） -->
  <path d="M 100 280
           L 412 280
           Q 412 290 408 300
           L 380 410
           Q 372 440 340 440
           L 172 440
           Q 140 440 132 410
           L 104 300
           Q 100 290 100 280 Z"
        fill="#F5D58C"
        stroke="#F5D58C"
        stroke-width="0"/>

  <!-- 碗内顶部阴影（汤面） -->
  <ellipse cx="256" cy="290" rx="156" ry="14" fill="#7A2614" opacity="0.5"/>

  <!-- 兆字嵌在碗中央 -->
  <text x="256" y="395" text-anchor="middle"
        font-family="STKaiti, 'Songti SC', serif"
        font-size="130"
        font-weight="700"
        fill="#7A2614">兆</text>
</svg>
